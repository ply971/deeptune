name: deeptune test

on:
  push:
    branches: [ master, GUI, development, video-analysis ]
  pull_request:
    branches: [ master, GUI, development, video-analysis ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      # CPU-only torch wheels (same versions as requirements.txt) are far
      # smaller than the default CUDA builds and are all CI needs.
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install pytest

    - name: Check (pip check + full test suite)
      env:
        OMP_NUM_THREADS: '2'
        MKL_NUM_THREADS: '2'
      run: bash scripts/check.sh --quick

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: junit
        path: .artifacts/check/

    - name: Build package
      run: python -m pip wheel . --no-deps --wheel-dir dist
